name: Application Deploy

on:
  workflow_run:
    workflows:
      - "Docker Build & Push"
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/ecr-tprepo

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_DOCKER_PUSH_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ECR_DOCKER_PUSH_SECRET_KEY }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3

      - uses: actions/cache@v4
        with:
          path: infrastructure/.terraform
          key: terraform-${{ hashFiles('infrastructure/.terraform.lock.hcl') }}
          restore-keys: terraform-

      - run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_DEPLOY_TOKEN }}

      - run: terraform validate

      - name: Deploy
        run: |
          # Use <head_sha> to make sure we're using the same sha that triggered the workflow
          IMAGE_TAG=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          terraform apply -auto-approve \
            -var="image_tag=$IMAGE_TAG" \
            -var="ecr_repository_url=$ECR_REPOSITORY_URL"
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_DEPLOY_TOKEN }}
